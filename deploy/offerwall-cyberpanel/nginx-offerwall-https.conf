# Production TLS vhost for the isolated Offerwall clone.
map $request_method $offerwall_login_key {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $offerwall_login_key zone=offerwall_login:10m rate=30r/m;

server {
    listen 80;
    server_name offerwall.rmwinsights.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/rmwins-acme;
        default_type text/plain;
    }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name offerwall.rmwinsights.com;
    client_max_body_size 12m;

    ssl_certificate /etc/letsencrypt/live/offerwall.rmwinsights.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/offerwall.rmwinsights.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:OfferwallTLS:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /api/v1/auth/login/ {
        limit_req zone=offerwall_login burst=10 nodelay;
        client_max_body_size 16k;
        error_page 413 = @offerwall_login_json_413;
        error_page 429 = @offerwall_login_json_429;
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header CF-IPCountry "";
        proxy_set_header Forwarded "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location = /admin/login/ {
        limit_req zone=offerwall_login burst=10 nodelay;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header CF-IPCountry "";
        proxy_set_header Forwarded "";
    }

    location @offerwall_login_json_413 {
        default_type application/json;
        return 413 '{"authenticated":false,"error":"The login request is too large."}';
    }

    location @offerwall_login_json_429 {
        default_type application/json;
        add_header Retry-After "60" always;
        return 429 '{"authenticated":false,"error":"Too many login attempts. Please try again later."}';
    }

    location = /setup { return 302 /admin/; }
    location = /setup/ { return 302 /admin/; }

    location = /login { return 301 /login/$is_args$args; }
    location = /login/ { proxy_pass http://127.0.0.1:8096/index.html; }
    location = /favicon.ico { proxy_pass http://127.0.0.1:8096/favicon.ico; }
    location ^~ /assets/ { proxy_pass http://127.0.0.1:8096; }

+    location ^~ /embed/ {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header CF-IPCountry "";
        proxy_set_header Forwarded "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location ^~ /wall/session/ {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header CF-IPCountry "";
        proxy_set_header Forwarded "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }


    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header CF-IPCountry "";
        proxy_set_header Forwarded "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
