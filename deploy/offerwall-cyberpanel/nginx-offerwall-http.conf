# Pre-certificate vhost for the isolated Offerwall clone. Install only after
# offerwall.rmwinsights.com resolves to this server, then replace it with the
# HTTPS template after Certbot succeeds.
map $request_method $offerwall_login_key {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $offerwall_login_key zone=offerwall_login:10m rate=30r/m;

server {
    listen 80;
    server_name offerwall.rmwinsights.com;
    client_max_body_size 12m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/rmwins-acme;
        default_type text/plain;
    }

    location = /api/v1/auth/login/ {
        limit_req zone=offerwall_login burst=10 nodelay;
        client_max_body_size 16k;
        error_page 413 = @offerwall_login_json_413;
        error_page 429 = @offerwall_login_json_429;
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header CF-IPCountry "";
        proxy_set_header Forwarded "";
    }

    location = /admin/login/ {
        limit_req zone=offerwall_login burst=10 nodelay;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header CF-IPCountry "";
        proxy_set_header Forwarded "";
    }

    location @offerwall_login_json_413 {
        default_type application/json;
        return 413 '{"authenticated":false,"error":"The login request is too large."}';
    }

    location @offerwall_login_json_429 {
        default_type application/json;
        add_header Retry-After "60" always;
        return 429 '{"authenticated":false,"error":"Too many login attempts. Please try again later."}';
    }

    location = /setup { return 302 /admin/; }
    location = /setup/ { return 302 /admin/; }

    # React owns login/result presentation; the Django workspace owns every
    # other route, including /, APIs, callbacks, admin and reports.
    location = /login { return 301 /login/$is_args$args; }
    location = /login/ { proxy_pass http://127.0.0.1:8096/index.html; }
    location = /favicon.ico { proxy_pass http://127.0.0.1:8096/favicon.ico; }
    location ^~ /assets/ { proxy_pass http://127.0.0.1:8096; }

    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header CF-IPCountry "";
        proxy_set_header Forwarded "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
