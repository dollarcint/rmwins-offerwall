{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>{{ placement.name }} · RM Wins Offerwall</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#f3f8fc,#e9f1f8);font-family:Arial,sans-serif;color:#142844}.preview{width:min(620px,100%);padding:44px;border:1px solid #d8e4ee;border-radius:24px;background:#fff;text-align:center;box-shadow:0 20px 60px rgba(20,40,68,.1)}.mark{width:52px;height:52px;margin:0 auto 18px;border-radius:16px;display:grid;place-items:center;background:#123d70;color:#fff;font-size:25px}small{color:#16889a;font-weight:800;text-transform:uppercase;letter-spacing:.1em}h1{margin:12px 0 10px;font-size:28px}p{margin:0;color:#66778c;line-height:1.65}.ready{display:inline-flex;margin-top:22px;padding:8px 12px;border-radius:999px;background:#e8f8f2;color:#087654;font-size:12px;font-weight:800}
  </style>
</head>
<body><main class="preview"><div class="mark">▦</div><small>{{ placement.website_name }}</small><h1>{{ placement.name }}</h1><p>This secure placement is ready. Replace the iframe’s USER_ID placeholder to load matched survey inventory.</p><span class="ready">● Placement active</span></main></body>
</html>
